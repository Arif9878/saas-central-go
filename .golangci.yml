version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    revive:
      rules:
        # Every exported identifier is documented.
        - name: exported
          arguments: ["disableStutteringCheck"]
    depguard:
      rules:
        production:
          files:
            - "!$test"
          deny:
            - pkg: github.com/Arif9878/common/go/testkit
              desc: production packages must not depend on testkit
        all:
          deny:
            - pkg: github.com/satori/go.uuid
              desc: unmaintained; use github.com/google/uuid
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog
            - pkg: github.com/lib/pq
              desc: use github.com/jackc/pgx/v5
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests sign up and log in with made-up passwords and keys.
      - path: _test\.go$
        text: G101
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Arif9878/common/go
        - github.com/Arif9878/saas-central
